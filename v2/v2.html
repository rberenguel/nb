<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>Dual N-Back v2</title>
    <link rel="manifest" href="../manifest.json" />
    <link rel="icon" type="image/png" href="../icon.png" />
    <link rel="stylesheet" type="text/css" href="v2.css" />
    <link rel="stylesheet" href="../styling/inter.css" />
    <link rel="stylesheet" href="../styling/bpdots.css" />
    <link rel="stylesheet" href="../fonts/phosphor/phosphor.css" />
  </head>
  <body>
    <!-- Game container -->
    <div id="game-container">
      <!-- Top info bar -->
      <div id="top-bar">
        <div id="round-display"></div>
        <div id="level-display">1<sub>2</sub></div>
        <div id="brain-progress">
          <div class="brain-container">
            <div class="brain-base">&#xe74e;</div>
            <div class="brain-fill">&#xe74e;</div>
          </div>
          <div class="progress-text">0/120</div>
        </div>
      </div>

      <!-- Main grid area -->
      <div id="grid-container">
        <div class="grid">
          <div class="square" data-pos="0" id="s0">
            <div class="square-inner"></div>
          </div>
          <div class="square" data-pos="1" id="s1">
            <div class="square-inner"></div>
          </div>
          <div class="square" data-pos="2" id="s2">
            <div class="square-inner"></div>
          </div>
          <div class="square" data-pos="3" id="s3">
            <div class="square-inner"></div>
          </div>
          <div class="square" data-pos="4" id="s4">
            <div class="square-inner"></div>
          </div>
          <div class="square" data-pos="5" id="s5">
            <div class="square-inner"></div>
          </div>
          <div class="square" data-pos="6" id="s6">
            <div class="square-inner"></div>
          </div>
          <div class="square" data-pos="7" id="s7">
            <div class="square-inner"></div>
          </div>
          <div class="square" data-pos="8" id="s8">
            <div class="square-inner"></div>
          </div>
        </div>
      </div>

      <!-- Game buttons (hidden until game starts) -->
      <div id="button-left" class="side-button hidden">
        <span>Position</span>
      </div>
      <div id="button-right" class="side-button hidden">
        <span>Color</span>
      </div>
      <div id="button-bottom" class="bottom-button hidden">
        <span>Letter</span>
      </div>
      <div id="button-pause" class="pause-button hidden"></div>
    </div>

    <!-- Modal for game results -->
    <div id="modal" class="hidden">
      <div id="modal-content"></div>
    </div>

    <script type="module" src="v2.js"></script>
  </body>
</html>
